services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env.db
    environment:
      POSTGRES_DB: papertrader
      POSTGRES_USER: papertrader
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - papertrader-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U papertrader -d papertrader']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  papertrader-postgres:
