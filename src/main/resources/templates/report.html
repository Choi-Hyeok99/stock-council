<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>봇 정기 보고서</title><link rel="stylesheet" href="/css/dashboard.css"><link rel="stylesheet" href="/css/site-navigation.css"></head>
<body><main><header><div class="brand">봇 정기 보고서</div><a class="source-link" href="/research">교육·보고 목록</a></header>
<h1 th:text="${report.reportDate + ' · ' + report.title}"></h1><p class="subtitle" th:text="${'예약 ' + scheduledKst + ' / 작성·집계 종료 ' + generatedKst}"></p>
<p class="journal-note" th:text="${report.timing == 'ON_TIME' ? '예약 후 5분 이내 작성했어요.' : '예약을 놓쳐 현재 상태로 지연 작성했어요. 예약 당시 상태를 복원한 보고서가 아니에요.'}"></p>
<p class="hint" th:text="${report.marketPhase}"></p><div class="report-links"><a th:href="@{/reports/{id}.md(id=${entry.id})}">Markdown 내려받기</a><a href="/">대시보드</a><a href="/committee">주문·체결 관리</a></div>
<div class="section-head"><h2 th:text="${report.version == 'BROKER_EXECUTION_V2' ? '오늘의 증권사 체결 확인 기록' : '오늘의 내부 모의 기록'}"></h2></div><div class="card account">
<div class="metric"><div class="metric-label" th:text="${report.version == 'BROKER_EXECUTION_V2' ? '실현 순손익 · 비용 추정' : '실현 순손익'}"></div><div class="metric-value" th:text="${#numbers.formatDecimal(report.today.netPnl, 1, 'COMMA', 0, 'POINT') + '원'}"></div></div>
<div class="metric"><div class="metric-label">매도 완료 거래</div><div class="metric-value" th:text="${report.today.closedTrades + '건'}"></div></div>
<div class="metric"><div class="metric-label" th:text="${report.version == 'BROKER_EXECUTION_V2' ? '수수료·세금 추정' : '수수료·세금·슬리피지'}"></div><div class="metric-value" th:text="${#numbers.formatDecimal(report.today.commission + report.today.transactionTax + report.today.slippage, 1, 'COMMA', 0, 'POINT') + '원'}"></div></div>
<div class="metric"><div class="metric-label" th:text="${report.version == 'BROKER_EXECUTION_V2' ? '증권사 예수금' : '내부 모의 현금'}"></div><div class="metric-value" th:text="${report.account.cash == null ? '미확인' : #numbers.formatDecimal(report.account.cash, 1, 'COMMA', 0, 'POINT') + '원'}"></div></div></div>
<p class="hint" th:text="${report.version == 'BROKER_EXECUTION_V2' ? '오늘 0시부터 작성 시각까지 봇이 체결한 기록의 결과예요. 부분 매도 순손익도 포함하지만 거래 수는 완전히 청산된 왕복 거래만 세요. 보유 평가손익과 다른 계좌 성과는 섞지 않아요.' : '오늘 0시부터 작성 시각까지의 누적 결과. 보유분 평가손익과 증권사 계좌 성과는 포함하지 않아요.'}"></p>
<div class="performance-grid"><article class="card performance-card" th:each="period : ${report.periods}"><span class="performance-label" th:text="${period.label}"></span><strong class="performance-value" th:text="${#numbers.formatDecimal(period.netPnl,1,'COMMA',0,'POINT') + '원'}"></strong><span class="performance-detail" th:text="${period.closedTrades + '건 · 실현 순손익'}"></span></article></div>
<div class="section-head"><h2 th:text="${report.version == 'BROKER_EXECUTION_V2' ? '한국투자 계좌 조회 기록' : '한국투자 모의계좌 조회 기록'}"></h2></div><div class="card journal-panel">
<p class="hint" th:if="${report.broker == null}">확인된 잔고 조회가 없어요.</p>
<div th:if="${report.broker != null}"><strong th:text="${report.broker.state}"></strong><p class="hint" th:text="${'조회 시각: ' + (report.broker.receivedAt == null ? '미확인' : report.broker.receivedAt)}"></p>
<p th:text="${report.broker.totalAssets == null ? '총평가금액 미확인' : '총평가금액 ' + #numbers.formatDecimal(report.broker.totalAssets,1,'COMMA',0,'POINT') + '원'}"></p>
<p class="hint" th:text="${report.broker.fresh ? '보고 작성 시 120초 이내 조회' : '이전 기록 또는 조회 미확인'}"></p></div>
<p class="hint" th:text="${report.version == 'BROKER_EXECUTION_V2' ? '계좌 합계와 봇 체결 손익은 구분해요. 실제 수수료·세금 정산 대조 전까지 손익 비용은 추정치예요.' : '이 잔고와 내부 모의 원장의 손익은 별도 기록이에요.'}"></p></div>
<div class="section-head"><h2>봇들이 남긴 판단</h2></div><div class="card journal-panel">
<p class="hint" th:if="${report.meeting == null}">확인된 회의록이 없어요.</p>
<div th:if="${report.meeting != null}"><p class="journal-note" th:text="${'보관 회의 ID ' + report.meeting.id + ' · ' + report.meeting.occurredAt}"></p>
<article class="meeting-speaker" th:each="speaker : ${report.meeting.report.speakers}"><strong th:text="${speaker.name + ' · ' + speaker.state}"></strong><p th:text="${speaker.summary}"></p><p class="hint" th:text="${speaker.detail}"></p></article>
<ul class="journal-blockers"><li th:each="blocker : ${report.meeting.report.blockers}" th:text="${blocker}"></li></ul>
<details th:if="${report.meeting.report.marketIndices != null}"><summary>회의 당시 시장 지수</summary><p class="reason" th:each="index : ${report.meeting.report.marketIndices}" th:text="${index.name + ' · ' + index.label + (index.quote == null ? '' : ' · ' + index.quote.value + ' · 기준일 ' + index.quote.businessDate + ' · 기준 시각 ' + (index.quote.basisAt == null ? '미확인' : index.quote.basisAt) + ' · 수신 ' + index.quote.receivedAt)}"></p></details>
<details th:each="stock : ${report.meeting.report.stocks}" th:if="${stock.selectionRationale != null}" class="selection-rationale"><summary th:text="${stock.name + ' · 선정 근거'}"></summary><p class="hint" th:text="${(stock.selectionRationale.method == null ? '당시 조회 순위 ' : '후보 탐색 순서 ') + stock.selectionRationale.rankingRank + ' · 입력 수신 ' + stock.selectionRationale.rankingReceivedAt + ' · 일봉 ' + stock.selectionRationale.dailyBasisDate}"></p><p class="reason" th:each="check : ${stock.selectionRationale.checks}" th:text="${check.role + ' · ' + check.title + ' · ' + check.detail}"></p></details>
<details th:if="${report.meeting.report.education != null}"><summary>투자 원칙 점검 결과</summary><article class="study-item" th:each="check : ${report.meeting.report.education.checks}"><strong th:text="${check.name + ' · ' + check.state}"></strong><p class="hint" th:text="${check.detail}"></p></article></details></div></div>
<div class="section-head"><h2>학습 준비와 다음 단계</h2></div><div class="card journal-panel"><p th:text="${'실제 장중 관찰 ' + report.learning.observationDays + '일 · 종료 거래 ' + report.learning.closedTrades + '건'}"></p><ul class="journal-blockers"><li th:each="note : ${report.learning.limitations}" th:text="${note}"></li></ul><h3>다음 준비</h3><ul class="journal-blockers"><li th:each="action : ${report.nextActions}" th:text="${action}"></li></ul></div>
<div class="section-head"><h2>보고 기준·한계</h2></div><div class="card journal-panel"><ul class="journal-blockers"><li th:each="note : ${report.notes}" th:text="${note}"></li></ul><p class="hint" th:text="${report.curriculum.version + ' · 공식 자료 검토 ' + report.curriculum.reviewedAt}"></p><p class="hint source-link" th:text="${'교육 기준 SHA-256 ' + report.curriculumHash}"></p><article class="study-item" th:each="source : ${report.curriculum.sources}"><a class="source-link" th:href="${source.url}" target="_blank" rel="noopener noreferrer" th:text="${source.publisher + ' · ' + source.title}"></a></article></div>
</main><script src="/js/site-navigation.js" defer></script></body></html>
